<html>
<head>
    <title>Sample app</title>
    <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
    <h1>You are calling me from {{request.remote_addr}}</h1>
    <form method="POST" action="/add">
    <label for="ip">IP:</label><input id="ip" name="ip" placeholder="" required />
    <label for="name">Username:</label><input id="name" name="username" placeholder="" required />
    <label for="password">Password:</label><input id="password" name="password" placeholder="" required />
    <button type="submit">Add</button>
  </form>
  <h2>Router List</h2>
  <ul>
    {% for comment in data %}
      <li>
	       <a href="{{ url_for('router_detail', ip=comment.ip) }}">{{ comment.ip }}</a> - {{ comment.username }}	 
         <form method="POST" action="{{ url_for('delete_comment') }}" style="display:inline">
           <input type="hidden" name="ip" value="{{ comment.ip }}">
           <button type="submit">Delete</button>
         </form>
      </li>
    {% endfor %}
  </ul>

</body>
</html>
